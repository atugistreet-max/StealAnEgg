<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🥚 卵を盗む！ずかん＆きろく</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: 子どもと高齢の方にも読みやすい丸ゴシック -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f8fafc;
    }

    /* 横スクロールバーをすっきり隠す */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Cosmic（にじ色）アニメーション */
    .rarity-cosmic {
      background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #c77dff);
      background-size: 250% 250%;
      animation: cosmicShift 5s ease infinite;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    @keyframes cosmicShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Secret（深紅×漆黒） */
    .rarity-secret {
      background: linear-gradient(135deg, #18181b 0%, #7f1d1d 55%, #dc2626 100%);
      color: #fef2f2;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }

    /* Eternal（濃い紫と銀） */
    .rarity-eternal {
      background: linear-gradient(135deg, #2e1065 0%, #581c87 45%, #cbd5e1 100%);
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(15, 23, 42, 0.7);
    }

    /* Divine（白金色に光る感じ） */
    .rarity-divine {
      background: linear-gradient(135deg, #fffbeb 0%, #fef08a 30%, #ffffff 55%, #fde047 80%, #fef9c3 100%);
      background-size: 220% 220%;
      animation: divineGlow 3.5s ease infinite;
      color: #713f12;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.55);
    }
    @keyframes divineGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ゲット済み中央の大きな金色★ */
    .owned-star-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }
    .owned-star-icon {
      font-size: clamp(2.1rem, 8.5vw, 3.2rem);
      line-height: 1;
      color: #facc15;
      -webkit-text-stroke: 2px #ffffff;
      paint-order: stroke fill;
      filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.35));
    }

    /* カードタップ反応 */
    .pet-card {
      transition: transform 0.12s ease, box-shadow 0.15s ease, background-color 0.15s ease, filter 0.15s ease;
    }
    .pet-card:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="pb-24 text-slate-800 select-none">

  <!-- ヘッダー -->
  <header id="appHeader" class="sticky top-0 z-30 bg-sky-600 text-white shadow-md transition-colors duration-300">
    <div class="max-w-3xl mx-auto px-3 pt-3 pb-2.5">
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <h1 class="text-lg sm:text-xl font-black tracking-tight flex items-center gap-1.5">
          <span>🥚</span>
          <span>卵を盗む！ずかん＆きろく</span>
        </h1>
        <div class="flex items-center gap-1.5">
          <button id="syncBtn" onclick="syncFromServer(true)" class="bg-white/20 hover:bg-white/30 active:scale-95 text-white font-bold text-sm px-2.5 py-1.5 rounded-xl flex items-center gap-1 transition">
            <span>🔄</span><span class="hidden sm:inline">同期</span>
          </button>
          <button onclick="openSettingsModal()" class="bg-white/20 hover:bg-white/30 active:scale-95 text-white font-bold text-sm px-2.5 py-1.5 rounded-xl transition" aria-label="設定">
            ⚙️
          </button>
        </div>
      </div>

      <!-- プレイヤー切り替え -->
      <div class="grid grid-cols-2 gap-2">
        <button id="btnPlayerHaruya" onclick="switchPlayer('はるや')" class="py-2.5 rounded-2xl font-black text-base sm:text-lg flex items-center justify-center gap-2 transition shadow-sm border-2">
          <span>👦</span><span>はるや</span>
        </button>
        <button id="btnPlayerJiiji" onclick="switchPlayer('じいじ')" class="py-2.5 rounded-2xl font-black text-base sm:text-lg flex items-center justify-center gap-2 transition shadow-sm border-2">
          <span>👴</span><span>じいじ</span>
        </button>
      </div>

      <!-- 同期ステータス -->
      <div class="mt-2 flex items-center justify-between text-xs font-bold text-white/90 px-1">
        <div id="syncStatusText" class="flex items-center gap-1.5 truncate">
          <span>⏳</span><span>じゅんび中...</span>
        </div>
        <div id="lastSyncTime" class="shrink-0 opacity-85"></div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-3xl mx-auto px-3 pt-3">

    <!-- ==================== タブ1: ペットずかん ==================== -->
    <section id="viewDex" class="space-y-3">
      <!-- コンプリート率カード -->
      <div class="bg-white rounded-3xl p-4 shadow-sm border-2 border-slate-100">
        <div class="flex items-end justify-between mb-2">
          <div>
            <div class="text-xs font-bold text-slate-500">あつめたペット</div>
            <div class="text-2xl sm:text-3xl font-black text-slate-800">
              <span id="ownedCount" class="text-sky-600">0</span>
              <span class="text-lg text-slate-400 mx-1">/</span>
              <span id="totalCount">91</span>
              <span class="text-base font-bold text-slate-600 ml-1">ぴき</span>
            </div>
          </div>
          <div class="text-right">
            <div class="text-xs font-bold text-slate-500">コンプリート率</div>
            <div id="completePercent" class="text-2xl sm:text-3xl font-black text-emerald-600">0%</div>
          </div>
        </div>
        <div class="w-full h-4 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
          <div id="completeBar" class="h-full bg-gradient-to-r from-emerald-400 to-teal-500 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
      </div>

      <!-- バイオーム絞り込み（横スクロール対応） -->
      <div class="sticky top-[132px] z-20 -mx-3 px-3 py-2 bg-slate-50/95 backdrop-blur-sm border-b border-slate-200/70">
        <div id="biomeFilterContainer" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-0.5">
          <!-- JSで生成 -->
        </div>
      </div>

      <!-- ペット一覧 -->
      <div id="petListContainer" class="space-y-5 pt-1">
        <!-- JSで生成 -->
      </div>
    </section>

    <!-- ==================== タブ2: きろく（進捗） ==================== -->
    <section id="viewProgress" class="hidden space-y-4">
      <!-- 最新のスピード・お金 -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white rounded-3xl p-4 shadow-sm border-2 border-sky-100">
          <div class="text-xs font-bold text-sky-600 mb-1">⚡ さいしんスピード</div>
          <div id="latestSpeed" class="text-2xl sm:text-3xl font-black text-slate-800 truncate">-</div>
        </div>
        <div class="bg-white rounded-3xl p-4 shadow-sm border-2 border-amber-100">
          <div class="text-xs font-bold text-amber-600 mb-1">💰 さいしんのお金</div>
          <div id="latestMoney" class="text-2xl sm:text-3xl font-black text-slate-800 truncate">-</div>
        </div>
      </div>

      <!-- 新しいきろく入力フォーム -->
      <div class="bg-white rounded-3xl p-4 shadow-sm border-2 border-slate-100 space-y-3">
        <h2 class="text-lg font-black text-slate-800 flex items-center gap-1.5">
          <span>✏️</span><span>きょうのきろくをのこす</span>
        </h2>
        <div class="space-y-3">
          <div>
            <label class="block text-sm font-bold text-slate-600 mb-1">📅 日付</label>
            <input type="date" id="inputDate" class="w-full text-lg font-bold px-3.5 py-2.5 rounded-2xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none bg-slate-50">
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-sm font-bold text-slate-600 mb-1">⚡ スピード</label>
              <input type="text" id="inputSpeed" placeholder="例: 120" class="w-full text-lg font-bold px-3.5 py-2.5 rounded-2xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none bg-slate-50">
            </div>
            <div>
              <label class="block text-sm font-bold text-slate-600 mb-1">💰 お金</label>
              <input type="text" id="inputMoney" placeholder="例: $5.2M" class="w-full text-lg font-bold px-3.5 py-2.5 rounded-2xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none bg-slate-50">
            </div>
          </div>
          <button onclick="handleAddProgress()" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] text-white font-black text-lg rounded-2xl shadow-sm transition">
            💾 きろくをほぞんする
          </button>
        </div>
      </div>

      <!-- 過去のきろく一覧 -->
      <div class="bg-white rounded-3xl p-4 shadow-sm border-2 border-slate-100">
        <h2 class="text-lg font-black text-slate-800 mb-3 flex items-center gap-1.5">
          <span>📜</span><span>これまでのきろく</span>
        </h2>
        <div id="progressList" class="space-y-2.5">
          <!-- JSで生成 -->
        </div>
      </div>
    </section>

    <!-- ==================== タブ3: ペット追加 ==================== -->
    <section id="viewAddPet" class="hidden space-y-4">
      <div class="bg-white rounded-3xl p-4 shadow-sm border-2 border-slate-100 space-y-4">
        <h2 class="text-lg font-black text-slate-800 flex items-center gap-1.5">
          <span>➕</span><span>あたらしいペットをずかんに追加</span>
        </h2>

        <!-- プレビュー -->
        <div class="p-3 bg-slate-50 rounded-2xl border border-slate-200">
          <div class="text-xs font-bold text-slate-400 mb-2">カードのプレビュー</div>
          <div id="addPetPreview"></div>
        </div>

        <div class="space-y-3">
          <div>
            <label class="block text-sm font-bold text-slate-600 mb-1">🐾 ペットの名前（英語でも日本語でもOK）</label>
            <input type="text" id="newPetName" oninput="updateAddPetPreview()" placeholder="例: Golden Dragon" class="w-full text-lg font-bold px-3.5 py-2.5 rounded-2xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none bg-slate-50">
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-sm font-bold text-slate-600 mb-1">🗺️ バイオーム</label>
              <select id="newPetBiome" onchange="updateAddPetPreview()" class="w-full text-base font-bold px-3 py-2.5 rounded-2xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none bg-slate-50">
                <!-- JSで生成 -->
              </select>
            </div>
            <div>
              <label class="block text-sm font-bold text-slate-600 mb-1">✨ レア度</label>
              <select id="newPetRarity" onchange="updateAddPetPreview()" class="w-full text-base font-bold px-3 py-2.5 rounded-2xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none bg-slate-50">
                <!-- JSで生成 -->
              </select>
            </div>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-600 mb-1">💵 1秒あたりの収入</label>
            <input type="text" id="newPetIncome" oninput="updateAddPetPreview()" placeholder="例: $50K/s" class="w-full text-lg font-bold px-3.5 py-2.5 rounded-2xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none bg-slate-50">
          </div>

          <button onclick="handleAddPet()" class="w-full py-3.5 bg-sky-500 hover:bg-sky-600 active:scale-[0.98] text-white font-black text-lg rounded-2xl shadow-sm transition">
            ✨ ずかんに追加する
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- 下部ナビゲーション -->
  <nav class="fixed bottom-0 inset-x-0 z-30 bg-white border-t-2 border-slate-200 shadow-lg">
    <div class="max-w-3xl mx-auto grid grid-cols-3">
      <button id="navDex" onclick="switchTab('dex')" class="py-2.5 flex flex-col items-center justify-center gap-0.5 font-black text-xs sm:text-sm text-sky-600">
        <span class="text-2xl">📖</span>
        <span>ずかん</span>
      </button>
      <button id="navProgress" onclick="switchTab('progress')" class="py-2.5 flex flex-col items-center justify-center gap-0.5 font-bold text-xs sm:text-sm text-slate-400">
        <span class="text-2xl">📈</span>
        <span>きろく</span>
      </button>
      <button id="navAddPet" onclick="switchTab('addPet')" class="py-2.5 flex flex-col items-center justify-center gap-0.5 font-bold text-xs sm:text-sm text-slate-400">
        <span class="text-2xl">➕</span>
        <span>ペット追加</span>
      </button>
    </div>
  </nav>

  <!-- 設定モーダル -->
  <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-xl font-black text-slate-800">⚙️ スプレッドシート連携設定</h3>
        <button onclick="closeSettingsModal()" class="text-2xl text-slate-400 hover:text-slate-600 font-bold px-2">×</button>
      </div>

      <div class="space-y-2">
        <label class="block text-sm font-bold text-slate-600">Google Apps Script ウェブアプリURL</label>
        <input type="url" id="inputGasUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full text-sm font-bold px-3.5 py-3 rounded-2xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none bg-slate-50">
        <p class="text-xs text-slate-500 leading-relaxed">
          ※ デプロイしたURLを貼り付けて「保存して接続テスト」を押してください。
        </p>
      </div>

      <div class="flex flex-col sm:flex-row gap-2 pt-1">
        <button onclick="saveAndTestGasUrl()" class="flex-1 py-3 bg-sky-500 hover:bg-sky-600 text-white font-black rounded-2xl transition">
          💾 保存して接続テスト
        </button>
        <button onclick="closeSettingsModal()" class="py-3 px-5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl transition">
          とじる
        </button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl text-white font-black text-sm shadow-xl opacity-0 pointer-events-none transition-all duration-300 max-w-[90vw] text-center">
  </div>

    // =========================================================================
    // アプリ状態管理
    // =========================================================================
    const state = {
      gasUrl: DEFAULT_GAS_URL,
      currentPlayer: 'はるや',
      currentTab: 'dex',
      selectedBiome: 'すべて',
      owned: [],       // [{ player, pet }]
      progress: [],    // [{ player, date, speed, money }]
      customPets: [],  // [{ name, jp?, biome, rarity, income }]
      isSyncing: false
    };

    // =========================================================================
    // 初期化・ローカルストレージ
    // =========================================================================
    function init() {
      loadLocalState();
      initFormOptions();
      setTodayDate();
      updatePlayerTheme();
      renderAllViews();
      updateAddPetPreview();

      if (state.gasUrl) {
        syncFromServer(false);
      } else {
        setSyncStatus('idle', 'まだスプレッドシートに同期していません');
      }
    }

    function loadLocalState() {
      try {
        const savedUrl = localStorage.getItem(STORAGE_KEYS.GAS_URL) || DEFAULT_GAS_URL;
        if (savedUrl) state.gasUrl = savedUrl.trim();

        const savedPlayer = localStorage.getItem(STORAGE_KEYS.PLAYER);
        if (savedPlayer === 'はるや' || savedPlayer === 'じいじ') {
          state.currentPlayer = savedPlayer;
        }

        const savedDataRaw = localStorage.getItem(STORAGE_KEYS.DATA);
        if (savedDataRaw) {
          const parsed = JSON.parse(savedDataRaw);
          if (Array.isArray(parsed.owned)) state.owned = parsed.owned;
          if (Array.isArray(parsed.progress)) state.progress = parsed.progress;
          if (Array.isArray(parsed.customPets)) state.customPets = parsed.customPets;
        }
      } catch (e) {
        console.warn('ローカルデータの読み込みに失敗:', e);
      }
    }

    function saveLocalData() {
      try {
        localStorage.setItem(STORAGE_KEYS.DATA, JSON.stringify({
          owned: state.owned,
          progress: state.progress,
          customPets: state.customPets
        }));
      } catch (e) {
        console.warn('ローカル保存に失敗:', e);
      }
    }

    function initFormOptions() {
      const biomeSelect = document.getElementById('newPetBiome');
      biomeSelect.innerHTML = BIOMES.map(b =>
        `<option value="${b.id}">${b.icon} ${b.name}</option>`
      ).join('');

      const raritySelect = document.getElementById('newPetRarity');
      raritySelect.innerHTML = Object.keys(RARITY_STYLES).map(r =>
        `<option value="${r}">${r}</option>`
      ).join('');
    }

    function setTodayDate() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      document.getElementById('inputDate').value = `${yyyy}-${mm}-${dd}`;
    }

    function getAllPets() {
      const names = new Set(DEFAULT_PETS.map(p => p.name));
      const extras = state.customPets.filter(p => p && p.name && !names.has(p.name));
      return [...DEFAULT_PETS, ...extras];
    }

    function getPetDisplayName(pet) {
      if (pet && typeof pet.jp === 'string' && pet.jp.trim() !== '') {
        return pet.jp.trim();
      }
      return pet ? pet.name : '';
    }

    // =========================================================================
    // プレイヤー切り替え・タブ切り替え
    // =========================================================================
    function switchPlayer(player) {
      state.currentPlayer = player;
      localStorage.setItem(STORAGE_KEYS.PLAYER, player);
      updatePlayerTheme();
      renderAllViews();
    }

    function updatePlayerTheme() {
      const header = document.getElementById('appHeader');
      const btnHaruya = document.getElementById('btnPlayerHaruya');
      const btnJiiji = document.getElementById('btnPlayerJiiji');

      if (state.currentPlayer === 'はるや') {
        header.className = 'sticky top-0 z-30 bg-sky-600 text-white shadow-md transition-colors duration-300';
        btnHaruya.className = 'py-2.5 rounded-2xl font-black text-base sm:text-lg flex items-center justify-center gap-2 transition shadow-md border-2 bg-white text-sky-700 border-white';
        btnJiiji.className = 'py-2.5 rounded-2xl font-black text-base sm:text-lg flex items-center justify-center gap-2 transition border-2 bg-white/15 text-white/90 border-white/30 hover:bg-white/25';
      } else {
        header.className = 'sticky top-0 z-30 bg-orange-500 text-white shadow-md transition-colors duration-300';
        btnJiiji.className = 'py-2.5 rounded-2xl font-black text-base sm:text-lg flex items-center justify-center gap-2 transition shadow-md border-2 bg-white text-orange-600 border-white';
        btnHaruya.className = 'py-2.5 rounded-2xl font-black text-base sm:text-lg flex items-center justify-center gap-2 transition border-2 bg-white/15 text-white/90 border-white/30 hover:bg-white/25';
      }
    }

    function switchTab(tab) {
      state.currentTab = tab;
      document.getElementById('viewDex').classList.toggle('hidden', tab !== 'dex');
      document.getElementById('viewProgress').classList.toggle('hidden', tab !== 'progress');
      document.getElementById('viewAddPet').classList.toggle('hidden', tab !== 'addPet');

      const activeClass = state.currentPlayer === 'はるや' ? 'text-sky-600 font-black' : 'text-orange-500 font-black';
      const inactiveClass = 'text-slate-400 font-bold';

      document.getElementById('navDex').className = `py-2.5 flex flex-col items-center justify-center gap-0.5 text-xs sm:text-sm ${tab === 'dex' ? activeClass : inactiveClass}`;
      document.getElementById('navProgress').className = `py-2.5 flex flex-col items-center justify-center gap-0.5 text-xs sm:text-sm ${tab === 'progress' ? activeClass : inactiveClass}`;
      document.getElementById('navAddPet').className = `py-2.5 flex flex-col items-center justify-center gap-0.5 text-xs sm:text-sm ${tab === 'addPet' ? activeClass : inactiveClass}`;
    }

    // =========================================================================
    // 画面描画（図鑑・進捗）
    // =========================================================================
    function renderAllViews() {
      switchTab(state.currentTab);
      renderBiomeFilters();
      renderDex();
      renderProgress();
    }

    function selectBiome(biomeId) {
      state.selectedBiome = biomeId;
      renderBiomeFilters();
      renderDex();
    }

    function renderBiomeFilters() {
      const container = document.getElementById('biomeFilterContainer');
      const allBtnActive = state.selectedBiome === 'すべて';
      const activeColor = state.currentPlayer === 'はるや'
        ? 'bg-sky-600 text-white border-sky-600 shadow-sm'
        : 'bg-orange-500 text-white border-orange-500 shadow-sm';

      let html = `
        <button onclick="selectBiome('すべて')" class="shrink-0 whitespace-nowrap px-3.5 py-2 rounded-2xl text-sm font-black border-2 transition ${allBtnActive ? activeColor : 'bg-white text-slate-600 border-slate-200'}">
          🌈 すべて
        </button>
      `;

      BIOMES.forEach(b => {
        const isActive = state.selectedBiome === b.id;
        html += `
          <button onclick="selectBiome('${b.id}')" class="shrink-0 whitespace-nowrap px-3.5 py-2 rounded-2xl text-sm font-black border-2 transition ${isActive ? activeColor : 'bg-white text-slate-600 border-slate-200'}">
            ${b.icon} ${b.name}
          </button>
        `;
      });

      container.innerHTML = html;
    }

    function isPetOwned(player, petName) {
      return state.owned.some(item => item.player === player && item.pet === petName);
    }

    function renderDex() {
      const allPets = getAllPets();
      const playerOwnedSet = new Set(
        state.owned.filter(o => o.player === state.currentPlayer).map(o => o.pet)
      );

      const total = allPets.length;
      const ownedCount = allPets.filter(p => playerOwnedSet.has(p.name)).length;
      const percent = total > 0 ? Math.round((ownedCount / total) * 100) : 0;

      document.getElementById('ownedCount').textContent = ownedCount;
      document.getElementById('ownedCount').className = state.currentPlayer === 'はるや' ? 'text-sky-600' : 'text-orange-500';
      document.getElementById('totalCount').textContent = total;
      document.getElementById('completePercent').textContent = `${percent}%`;
      document.getElementById('completeBar').style.width = `${percent}%`;

      const targetBiomes = state.selectedBiome === 'すべて'
        ? BIOMES
        : BIOMES.filter(b => b.id === state.selectedBiome);

      const container = document.getElementById('petListContainer');
      let html = '';

      targetBiomes.forEach(biome => {
        const biomePets = allPets.filter(p => p.biome === biome.id);
        if (biomePets.length === 0) return;

        const biomeOwned = biomePets.filter(p => playerOwnedSet.has(p.name)).length;

        html += `
          <div>
            <div class="flex items-center justify-between mb-2 px-1">
              <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl border font-black text-sm ${biome.color}">
                <span>${biome.icon}</span>
                <span>${biome.name}</span>
              </div>
              <div class="text-sm font-black text-slate-500">
                ${biomeOwned} / ${biomePets.length}
              </div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
              ${biomePets.map(pet => renderPetCard(pet, playerOwnedSet.has(pet.name))).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function renderPetCard(pet, owned) {
      const style = RARITY_STYLES[pet.rarity] || RARITY_STYLES.Common;
      const escapedName = escapeAttr(pet.name);
      const displayName = getPetDisplayName(pet);
      const hasJp = typeof pet.jp === 'string' && pet.jp.trim() !== '';

      const cardClass = owned
        ? `${style.ownedBg} border-2 shadow-sm`
        : 'bg-slate-100/90 border-slate-300 border-2 grayscale opacity-75';

      return `
        <button onclick="togglePet('${escapedName}')" class="pet-card text-left rounded-2xl p-3 relative flex flex-col justify-between min-h-[124px] overflow-hidden ${cardClass}">
          ${owned ? `<div class="owned-star-overlay"><span class="owned-star-icon">★</span></div>` : ''}

          <div class="flex items-start justify-between gap-1 mb-1.5 relative z-20">
            <span class="inline-block px-2 py-0.5 rounded-lg text-[11px] font-black tracking-wide ${owned ? style.badge : 'bg-slate-400 text-white'}">
              ${style.label}
            </span>
            ${owned
              ? `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-emerald-500 text-white font-black text-base shadow-sm shrink-0">✓</span>`
              : `<span class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-slate-200 text-slate-400 font-black text-xs border border-slate-300 shrink-0">まだ</span>`
            }
          </div>

          <div class="relative z-20">
            <div class="font-black text-base sm:text-lg leading-snug ${owned ? 'text-slate-900' : 'text-slate-600'} break-words">
              ${escapeHtml(displayName)}
            </div>
            ${hasJp
              ? `<div class="text-[11px] font-bold leading-tight ${owned ? 'text-slate-500' : 'text-slate-400'} break-words mb-1">
                   ${escapeHtml(pet.name)}
                 </div>`
              : `<div class="mb-1"></div>`
            }
            <div class="text-xs sm:text-sm font-extrabold ${owned ? 'text-emerald-700' : 'text-slate-500'}">
              💰 ${escapeHtml(pet.income || '-')}
            </div>
          </div>
        </button>
      `;
    }

    function renderProgress() {
      const list = state.progress
        .filter(item => item.player === state.currentPlayer)
        .sort((a, b) => String(b.date).localeCompare(String(a.date)));

      if (list.length > 0) {
        document.getElementById('latestSpeed').textContent = list[0].speed || '-';
        document.getElementById('latestMoney').textContent = list[0].money || '-';
      } else {
        document.getElementById('latestSpeed').textContent = '-';
        document.getElementById('latestMoney').textContent = '-';
      }

      const container = document.getElementById('progressList');
      if (list.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-slate-400 font-bold text-sm">まだきろくがありません</div>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="flex items-center justify-between gap-2 p-3 rounded-2xl bg-slate-50 border border-slate-200">
          <div class="min-w-0">
            <div class="text-xs font-bold text-slate-400">📅 ${escapeHtml(item.date)}</div>
            <div class="flex flex-wrap items-center gap-x-3 gap-y-0.5 mt-0.5 font-black text-base text-slate-800">
              <span>⚡ ${escapeHtml(String(item.speed))}</span>
              <span>💰 ${escapeHtml(String(item.money))}</span>
            </div>
          </div>
          <button onclick="handleDeleteProgress('${escapeAttr(item.date)}', '${escapeAttr(String(item.speed))}', '${escapeAttr(String(item.money))}')" class="shrink-0 px-3 py-1.5 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-600 font-bold text-xs transition">
            けす
          </button>
        </div>
      `).join('');
    }

    // =========================================================================
    // 操作アクション（ペットチェック・進捗・ペット追加）
    // =========================================================================
    function togglePet(petName) {
      const player = state.currentPlayer;
      const alreadyOwned = isPetOwned(player, petName);
      const nextOwned = !alreadyOwned;
      const petObj = getAllPets().find(p => p.name === petName);
      const labelName = getPetDisplayName(petObj || { name: petName });

      if (nextOwned) {
        state.owned.push({ player, pet: petName });
        showToast(`★ ${labelName} をゲット！`, 'bg-emerald-500');
      } else {
        state.owned = state.owned.filter(o => !(o.player === player && o.pet === petName));
      }

      saveLocalData();
      renderDex();

      postToServer({
        action: 'togglePet',
        player,
        pet: petName,
        owned: nextOwned
      });
    }

    function handleAddProgress() {
      const date = document.getElementById('inputDate').value;
      const speed = document.getElementById('inputSpeed').value.trim();
      const money = document.getElementById('inputMoney').value.trim();

      if (!date || (!speed && !money)) {
        showToast('⚠️ 日付とスピードかお金を入力してね', 'bg-amber-500');
        return;
      }

      const record = {
        player: state.currentPlayer,
        date,
        speed: speed || '-',
        money: money || '-'
      };

      state.progress.push(record);
      saveLocalData();
      renderProgress();

      document.getElementById('inputSpeed').value = '';
      document.getElementById('inputMoney').value = '';
      showToast('💾 きろくをほぞんしました！', 'bg-emerald-500');

      postToServer({
        action: 'addProgress',
        ...record
      });
    }

    function handleDeleteProgress(date, speed, money) {
      if (!confirm(`${date} のきろくをけしてもいいですか？`)) return;

      const player = state.currentPlayer;
      const idx = state.progress.findIndex(item =>
        item.player === player &&
        String(item.date) === String(date) &&
        String(item.speed) === String(speed) &&
        String(item.money) === String(money)
      );

      if (idx !== -1) {
        state.progress.splice(idx, 1);
        saveLocalData();
        renderProgress();
        showToast('🗑️ きろくをけしました', 'bg-slate-600');

        postToServer({
          action: 'deleteProgress',
          player,
          date,
          speed,
          money
        });
      }
    }

    function updateAddPetPreview() {
      const name = document.getElementById('newPetName').value.trim() || 'なまえを入れてね';
      const biome = document.getElementById('newPetBiome').value || 'もり';
      const rarity = document.getElementById('newPetRarity').value || 'Common';
      const income = document.getElementById('newPetIncome').value.trim() || '$100/s';

      const previewEl = document.getElementById('addPetPreview');
      previewEl.innerHTML = `<div class="max-w-[200px] pointer-events-none">${renderPetCard({ name, biome, rarity, income }, true)}</div>`;
    }

    function handleAddPet() {
      const name = document.getElementById('newPetName').value.trim();
      const biome = document.getElementById('newPetBiome').value;
      const rarity = document.getElementById('newPetRarity').value;
      const income = document.getElementById('newPetIncome').value.trim() || '-';

      if (!name) {
        showToast('⚠️ ペットの名前を入力してね', 'bg-amber-500');
        return;
      }

      const exists = getAllPets().some(p => p.name.toLowerCase() === name.toLowerCase());
      if (exists) {
        showToast('⚠️ 同じ名前のペットがもうあるよ', 'bg-amber-500');
        return;
      }

      const newPet = { name, biome, rarity, income };
      state.customPets.push(newPet);
      saveLocalData();

      document.getElementById('newPetName').value = '';
      document.getElementById('newPetIncome').value = '';
      updateAddPetPreview();

      state.selectedBiome = biome;
      switchTab('dex');
      renderAllViews();
      showToast(`✨ ${name} をずかんに追加しました！`, 'bg-sky-500');

      postToServer({
        action: 'addPet',
        ...newPet
      });
    }

    // =========================================================================
    // スプレッドシート連携（GET / POST）
    // =========================================================================
    async function syncFromServer(showNotify = false) {
      if (!state.gasUrl) {
        setSyncStatus('idle', 'まだスプレッドシートに同期していません');
        if (showNotify) openSettingsModal();
        return;
      }

      if (state.isSyncing) return;
      state.isSyncing = true;
      setSyncStatus('syncing', '同期中...');

      try {
        const response = await fetch(state.gasUrl, {
          method: 'GET',
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(`HTTPエラー: ${response.status}`);
        }

        const data = await response.json();
        if (data.status !== 'ok') {
          throw new Error(data.message || 'データの形式が正しくありません');
        }

        // サーバーデータで状態を更新
        state.owned = Array.isArray(data.owned) ? data.owned : [];
        state.progress = Array.isArray(data.progress) ? data.progress : [];
        state.customPets = Array.isArray(data.customPets) ? data.customPets : [];

        saveLocalData();
        renderAllViews();

        setSyncStatus('ok', 'スプレッドシートと同期かんりょう！');
        updateLastSyncTime();

        if (showNotify) {
          showToast('🔄 最新データに同期しました！', 'bg-emerald-600');
        }
      } catch (err) {
        console.error('同期エラー:', err);
        setSyncStatus('error', 'オフライン（この端末のデータ表示中）');
        if (showNotify) {
          showToast('⚠️ 同期できませんでした。ネットやURLを確認してね', 'bg-rose-600');
        }
      } finally {
        state.isSyncing = false;
      }
    }

    async function postToServer(payload) {
      if (!state.gasUrl) return;
      setSyncStatus('syncing', 'ほぞん中...');
      try {
        await fetch(state.gasUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        setSyncStatus('ok', 'スプレッドシートにほぞんしました');
        updateLastSyncTime();
      } catch (err) {
        console.error('送信エラー:', err);
        setSyncStatus('error', '送信エラー（あとで同期を押してね）');
      }
    }

    function setSyncStatus(type, message) {
      const el = document.getElementById('syncStatusText');
      const icons = { idle: '⚪', syncing: '🔄', ok: '🟢', error: '🔴' };
      el.innerHTML = `<span>${icons[type] || '⚪'}</span><span>${escapeHtml(message)}</span>`;
    }

    function updateLastSyncTime() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('lastSyncTime').textContent = `${hh}:${mm} 更新`;
    }

    // =========================================================================
    // 設定モーダル・ユーティリティ
    // =========================================================================
    function openSettingsModal() {
      document.getElementById('inputGasUrl').value = state.gasUrl || '';
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    async function saveAndTestGasUrl() {
      const url = document.getElementById('inputGasUrl').value.trim();
      state.gasUrl = url;
      if (url) {
        localStorage.setItem(STORAGE_KEYS.GAS_URL, url);
      } else {
        localStorage.removeItem(STORAGE_KEYS.GAS_URL);
      }
      closeSettingsModal();
      await syncFromServer(true);
    }

    let toastTimer = null;
    function showToast(message, bgClass = 'bg-slate-800') {
      const el = document.getElementById('toast');
      el.className = `fixed top-20 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl text-white font-black text-sm shadow-xl transition-all duration-300 max-w-[90vw] text-center ${bgClass} opacity-100`;
      el.textContent = message;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove('opacity-100');
        el.classList.add('opacity-0');
      }, 2200);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) {
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    // 起動
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
